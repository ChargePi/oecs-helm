{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oecs-hub.fullname" . }}-web
  labels:
    {{- include "oecs-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "oecs-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "oecs-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.registry }}/{{ .Values.web.image.repository }}:{{ default .Chart.AppVersion .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          env:
            {{- /* A bare Service name (no namespace/domain suffix) doesn't resolve through
            nginx's own `resolver` directive the way it would through the pod's normal libc
            resolver (no search-domain suffixing) - must be the FQDN. */}}
            - name: BACKEND_URL
              value: {{ .Values.web.env.backendUrl | default (printf "http://%s.%s.svc.cluster.local:%d" (include "oecs-hub.fullname" .) .Release.Namespace (int .Values.grpc.service.port)) | quote }}
            - name: RESOLVER
              value: {{ .Values.web.env.resolver | quote }}
            {{- /* Left unset (not just empty) when not configured - the image ships its own
            inert-but-non-empty default so nginx's request-time proxy_pass resolution doesn't
            choke on an empty target; an explicit empty string here would be worse than unset. */}}
            {{- with .Values.web.env.conversationApiUrl }}
            - name: CONVERSATION_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.env.billingApiUrl }}
            - name: BILLING_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.env.kratosUrl }}
            - name: KRATOS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /* Chatwoot support widget, served to the SPA via /env.js - hidden unless both set. */}}
            {{- with .Values.web.env.chatwootBaseUrl }}
            - name: CHATWOOT_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.env.chatwootWebsiteToken }}
            - name: CHATWOOT_WEBSITE_TOKEN
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}

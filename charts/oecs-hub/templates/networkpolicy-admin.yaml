{{- if .Values.adminGrpc.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oecs-hub.fullname" . }}-admin
  labels:
    {{- include "oecs-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oecs-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- with .Values.adminGrpc.networkPolicy.extraIngressRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.adminGrpc.service.port }}
          protocol: TCP
{{- end }}

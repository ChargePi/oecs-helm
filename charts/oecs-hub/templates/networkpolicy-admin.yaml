{{- if .Values.adminGrpc.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oecs-hub.fullname" . }}-admin
  labels:
    {{- include "oecs-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oecs-hub.selectorLabels" . | nindent 6 }}
    # Excludes the web frontend - it shares this release's instance/name labels
    # but isn't a gRPC backend, so it has no business being governed by a
    # policy scoped to the gRPC ports below (selecting it here would switch it
    # to default-deny-all-ports and silently block its own port 8080).
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - web
  policyTypes:
    - Ingress
  ingress:
    # Selecting this pod at all switches it to default-deny-all-ports, so the
    # public grpc port needs its own unrestricted rule here too - otherwise
    # this policy (meant to only lock down adminGrpc) blocks it entirely,
    # including from Traefik.
    - ports:
        - port: {{ .Values.grpc.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- with .Values.adminGrpc.networkPolicy.extraIngressRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.adminGrpc.service.port }}
          protocol: TCP
{{- end }}

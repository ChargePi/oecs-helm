apiVersion: v1
kind: Pod
metadata:
  name: {{ include "oecs-hub.fullname" . }}-test-connection
  labels:
    {{- include "oecs-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: grpc-connect
      image: busybox:1.36
      command:
        - nc
        - -z
        - -w5
        - {{ include "oecs-hub.fullname" . }}
        - {{ .Values.grpc.service.port | quote }}
